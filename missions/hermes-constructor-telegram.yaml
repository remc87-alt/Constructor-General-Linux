mission_id: hermes-constructor-telegram
goal: "Conectar el Constructor Linux al flujo directo ya existente de Hermes/Telegram."
workspace: "."

deliverable: "Integración funcional Hermes/Telegram → mision_directa → despachar-directo → Constructor Linux → resultado estructurado."

constraints:
  - "Trabajar exclusivamente sobre el Constructor Linux y los componentes estrictamente necesarios para conectarlo."
  - "NO modificar Empresa-IA."
  - "NO modificar ni reconstruir el flujo Hermes-Symphony."
  - "NO integrar Symphony en este flujo."
  - "NO reinstalar Hermes."
  - "NO reinstalar Telegram."
  - "NO crear un bot nuevo."
  - "NO crear un dispatcher paralelo si existe uno reutilizable."
  - "Inspeccionar primero la implementación real existente de Hermes y localizar mision_directa y despachar-directo."
  - "Reutilizar las interfaces existentes."
  - "Inspeccionar el Mission Runner y mission_runner_structured.py existentes."
  - "Identificar el punto exacto donde Hermes puede entregar una misión al Constructor."
  - "Identificar el formato real de entrada y salida."
  - "Mantener el contrato de misión existente."
  - "Mantener PASS, FAIL y BLOCKED."
  - "Mantener mission_id durante todo el recorrido."
  - "No permitir ejecución arbitraria de comandos desde Telegram."
  - "No exponer secretos ni tokens."
  - "No abrir puertos nuevos salvo que una dependencia existente lo requiera y quede demostrado."
  - "No instalar paquetes salvo necesidad estrictamente demostrada."
  - "No hacer commits."
  - "Hacer cambios mínimos y únicamente relacionados con esta integración."
  - "Preparar una prueba canary mínima y segura."
  - "La prueba final debe permitir verificar Telegram → Hermes → mision_directa → despachar-directo → Constructor → resultado."
  - "Si la prueba física por Telegram no puede ejecutarse automáticamente desde esta misión, dejar todo preparado y entregar exactamente qué acción humana debe realizarse."
  - "No declarar PASS únicamente por inspección de código."
  - "No repetir pruebas históricas ya demostradas como PASS."
  - "Al finalizar entregar diagnóstico, archivos modificados, flujo real, pruebas ejecutadas, canary y estado final."
