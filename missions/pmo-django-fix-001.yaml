mission_id: pmo-django-fix-001
goal: "Completar y validar el proyecto Django PMO ya construido, corrigiendo únicamente las brechas detectadas en la misión original."
workspace: "."
deliverable: "Proyecto Django reproducible, con dependencias pinneadas y pruebas ejecutables en su entorno virtual."
constraints:
  - "Continuar sobre el proyecto Django existente. No reconstruirlo desde cero."
  - "Trabajar únicamente dentro de este repositorio."
  - "No modificar Empresa-IA."
  - "No ampliar el alcance funcional."
  - "Crear un archivo de dependencias pinneadas que permita reproducir el entorno."
  - "Incluir todas las dependencias realmente utilizadas por el proyecto."
  - "Asegurar que pytest esté disponible para ejecutar los tests."
  - "Ejecutar los tests usando el Python del venv del proyecto."
  - "Ejecutar python manage.py check."
  - "Corregir únicamente errores necesarios para que la misión original quede verificable."
  - "No agregar React, Vue, Bootstrap ni otra librería de UI."
  - "No construir minuta, planificación, OCR ni funcionalidades nuevas."
  - "No hacer commit."
  - "Al finalizar informar únicamente diff, pruebas ejecutadas, resultado y pendientes."
