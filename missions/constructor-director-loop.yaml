mission_id: constructor-director-loop
goal: "Construir el mecanismo de retorno estructurado entre Constructor General Linux y su Director, de modo que una misión pueda ejecutarse, devolver evidencia compacta al Director y permitir una siguiente instrucción sin reconstruir manualmente el contexto."
workspace: "."
deliverable: "Flujo Director → Constructor → ejecución → retorno estructurado → siguiente instrucción, preparado para iteraciones de una misma misión."
constraints:
  - "Trabajar únicamente dentro de este repositorio."
  - "No modificar Empresa-IA."
  - "No depender de archivos ni scripts internos de Empresa-IA."
  - "No integrar Hermes ni Telegram en esta misión."
  - "No reemplazar OpenCode, FreeLLMAPI ni el Mission Runner existente."
  - "Reutilizar primero las capacidades existentes de Constructor General Linux."
  - "Mantener el contrato de misión existente."
  - "Mantener el objetivo y las restricciones originales de una misión entre iteraciones."
  - "El retorno debe ser estructurado, compacto y legible."
  - "El retorno debe distinguir como mínimo PASS, FAIL y BLOCKED."
  - "El retorno debe incluir mission_id, estado, resumen, archivos modificados, pruebas, errores y siguiente acción."
  - "No devolver automáticamente terminales gigantescos como mecanismo principal de comunicación."
  - "No usar /tmp como dependencia obligatoria para generar o recuperar el resultado."
  - "Permitir que una siguiente instrucción continúe la misma misión sin comenzar desde cero."
  - "Mantener límites del workspace y restricciones de seguridad."
  - "No hacer commit automáticamente."
  - "Crear tests que demuestren el flujo completo."
  - "Documentar cómo ejecutar una misión, obtener el resultado estructurado y continuar una iteración."
  - "No construir todavía integración móvil, Hermes, Telegram, MCP ni otros canales remotos."
  - "No dar la misión por cerrada si solo existe documentación sin una prueba E2E."
  - "Al finalizar devolver: diff, arquitectura implementada, comandos de uso, pruebas ejecutadas y resultado E2E."
