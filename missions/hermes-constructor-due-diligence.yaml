mission_id: hermes-constructor-due-diligence
goal: "Determinar de forma segura la integración Hermes/Telegram con Constructor Linux y su retorno estructurado."
workspace: "."

deliverable: "Due diligence técnica y plan mínimo de integración sin alterar Empresa-IA ni el flujo Hermes-Symphony existente."

constraints:
  - "Trabajar exclusivamente sobre este repositorio."
  - "NO modificar Empresa-IA."
  - "NO modificar el flujo Hermes-Symphony de Empresa-IA."
  - "NO integrar Symphony en este flujo."
  - "NO modificar Hermes durante esta fase."
  - "NO modificar Telegram durante esta fase."
  - "NO instalar paquetes."
  - "NO abrir puertos."
  - "NO reiniciar servicios."
  - "NO hacer commits."
  - "Realizar principalmente lectura, auditoría y diseño."
  - "Reutilizar capacidades existentes antes de proponer componentes nuevos."
  - "Auditar quick_commands y ejecución local de Hermes."
  - "Auditar Mission Runner y mission_runner_structured.py."
  - "Determinar cómo Hermes puede entregar una misión al Constructor Linux."
  - "Determinar cómo Constructor Linux puede devolver un resultado estructurado a Hermes."
  - "Determinar cómo Hermes puede devolver ese resultado a Telegram."
  - "Mantener estados PASS, FAIL y BLOCKED."
  - "Mantener continuidad de una misma misión entre iteraciones."
  - "Identificar el adaptador mínimo necesario."
  - "Identificar los archivos que habría que modificar en una futura implementación."
  - "Identificar riesgos de seguridad y límites de ejecución."
  - "Distinguir evidencia actual de evidencia histórica."
  - "No reconstruir capacidades históricas ya demostradas como PASS."
  - "Si falta evidencia, indicarlo explícitamente."
  - "Proponer una prueba canary mínima antes de usar misiones reales."
  - "No implementar cambios durante esta misión."

output:
  - "DIAGNOSTICO"
  - "ARQUITECTURA_PROPUESTA"
  - "COMPONENTES_REUTILIZABLES"
  - "CAMBIOS_NECESARIOS"
  - "RIESGOS"
  - "PRUEBA_CANARY"
  - "PLAN_IMPLEMENTACION"
  - "VEREDICTO"
