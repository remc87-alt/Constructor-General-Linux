mission_id: pmo-django-fix-002
goal: "Cerrar definitivamente las brechas de validación del proyecto Django PMO existente."
workspace: "."
deliverable: "Proyecto Django reproducible y validado de extremo a extremo según la misión pmo-django-base."
constraints:
  - "Continuar sobre el proyecto existente. No reconstruir Django."
  - "Trabajar únicamente dentro de este repositorio."
  - "No modificar Empresa-IA."
  - "Crear requirements.txt con versiones pinneadas de las dependencias necesarias."
  - "Incluir pytest como dependencia de desarrollo necesaria para los tests."
  - "No depender de paquetes instalados accidentalmente fuera del archivo de dependencias."
  - "Instalar las dependencias en el venv existente usando requirements.txt."
  - "Mantener Django, django-htmx, Unfold y WhiteNoise ya utilizados por el proyecto."
  - "Mantener el kit fijado de la misión original."
  - "No agregar React, Vue, Bootstrap ni otra librería de UI."
  - "No construir nuevas funcionalidades."
  - "No construir minuta, planificación, OCR ni portafolio."
  - "Ejecutar python manage.py check usando el venv."
  - "Ejecutar los tests usando el Python del venv."
  - "Corregir los tests si existe un problema atribuible a la configuración del proyecto."
  - "Verificar que / responde 200."
  - "Verificar que el botón HTMX requerido existe en el HTML."
  - "Verificar que el proyecto puede arrancar mediante run.sh."
  - "No hacer commit."
  - "Al finalizar devolver únicamente: diff, dependencias creadas/ajustadas, pruebas ejecutadas, resultado PASS/FAIL/BLOCKED y pendientes."
