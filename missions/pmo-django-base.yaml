mission_id: pmo-django-base
goal: "Dejar un proyecto Django que arranque en Ubuntu WSL y se vea en el navegador, con el kit de interfaz instalado y una pantalla propia funcionando."
workspace: "."
deliverable: "Proyecto Django funcional con interfaz PMO, admin Unfold, estáticos WhiteNoise, AGENTS.md, comando único de arranque y tests pasando."
constraints:
  - "Django ya fue elegido. No investigar frameworks ni escribir un informe."
  - "No construir el módulo de minutas, planificación, OCR ni React."
  - "Trabajar solo en el repositorio Git ya abierto. Si no hay repo, detenerse e informar."
  - "Usar únicamente este kit: Django, Tailwind, HTMX, Alpine.js, django-htmx, Unfold solo para el admin y WhiteNoise."
  - "Crear el proyecto y fijar dependencias con versiones pinneadas."
  - "Crear una app vacía del producto con nombre visible PMO."
  - "Crear una pantalla propia en /, no el admin, con barra lateral, título PMO y página de inicio."
  - "El botón de la pantalla debe cambiar un texto sin recargar la página y debe usar HTMX."
  - "Configurar Unfold únicamente para /admin/."
  - "Crear usuario admin inicial mediante comando documentado."
  - "Configurar WhiteNoise para servir estáticos."
  - "Crear AGENTS.md en la raíz."
  - "AGENTS.md debe ordenar a futuras misiones usar solo este kit, no agregar React, no inventar otra librería de UI, reutilizar barra, botón y panel, y no investigar Django nuevamente."
  - "Crear un comando único para levantar el sitio en WSL e informar la URL local exacta."
  - "Crear un test que compruebe que / responde 200 y que el botón HTMX existe en el HTML."
  - "No instalar React, Vue, Bootstrap ni otra librería de UI."
  - "No construir minuta, transcripción, proyectos ni portafolio."
  - "No dar la misión por cerrada si solo existe requirements.txt."
  - "No hacer commit."
  - "Al finalizar devolver solo: diff, comando para arrancar, URL local, usuario admin y resultado del test."
