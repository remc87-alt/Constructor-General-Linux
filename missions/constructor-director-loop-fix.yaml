mission_id: constructor-director-loop-fix
goal: "Completar el mecanismo de continuidad entre Director y Constructor Linux."
workspace: "."
deliverable: "Una misión puede ejecutarse, devolver resultado estructurado, recibir una nueva instrucción y continuar la misma misión conservando su mission_id y contexto."
constraints:
  - "Modificar únicamente este repositorio."
  - "No modificar Empresa-IA."
  - "No integrar Hermes ni Telegram."
  - "No reemplazar OpenCode, FreeLLMAPI ni Mission Runner."
  - "Reutilizar bin/mission_runner_structured.py existente."
  - "Mantener el contrato de misión existente."
  - "Agregar una forma explícita de continuar una misión existente mediante una nueva instrucción."
  - "La continuación debe conservar mission_id, goal, workspace, deliverable y constraints originales."
  - "El resultado anterior debe estar disponible para la siguiente iteración."
  - "La nueva instrucción debe poder corregir un FAIL sin crear una misión nueva."
  - "El retorno debe seguir siendo JSON estructurado."
  - "El retorno debe incluir mission_id, state, summary, modified_files, tests, errors y next_action."
  - "Corregir la ejecución de pytest para utilizar correctamente el entorno virtual del workspace cuando exista."
  - "No depender de /tmp."
  - "Crear tests E2E para demostrar: ejecución inicial → retorno → continuación → nueva ejecución → retorno."
  - "Demostrar explícitamente una iteración FAIL seguida de una iteración PASS."
  - "No hacer commit."
  - "Al finalizar devolver: arquitectura implementada, archivos modificados, comandos de uso, pruebas ejecutadas y resultado E2E."
