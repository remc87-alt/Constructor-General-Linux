{% extends "base.html" %}

{% block title %}PMO - Home{% endblock %}

{% block sidebar %}
<aside class="w-64 bg-white border-r border-gray-200">
    <div class="p-4">
        <h1 class="text-xl font-bold text-gray-800">PMO</h1>
        <nav class="mt-6 space-y-2">
            <a href="{% url 'home' %}" class="px-3 py-2 rounded text-sm font-medium bg-gray-100 hover:bg-gray-200">Home</a>
        </nav>
    </div>
</aside>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Welcome to PMO</h2>
    <div class="space-y-4">
        <p id="message" class="text-gray-700">The button has not been clicked yet.</p>
        <button 
            hx-post="{% url 'change_text' %}"
            hx-target="#message"
            hx-swap="innerHTML"
            hx-headers='{"X-CSRFTOKEN": "{{ csrf_token }}"}'
            class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded"
        >
            Click me to change text
        </button>
    </div>
</div>
{% endblock %}
